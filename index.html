<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Hand Motion FX & Gestures</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-panel {
            position: absolute;
            border: 1px solid rgba(0, 255, 204, 0.4);
            background: rgba(0, 15, 10, 0.85);
            padding: 10px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            border-radius: 4px;
        }

        #top-left { top: 20px; left: 20px; }
        
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.25;
            z-index: 1;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        #instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 12px #00ffcc;
            z-index: 20;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <div id="top-left" class="hud-panel">
        MODALITÀ: <span id="effect-status" style="color: #00ffcc;">ATTESA GESTI (ANCHE DA LONTANO)...</span>
    </div>

    <div id="instruction">PUGNO = FUOCO • APRI/CHIUDI • BATTI LE MANI = ONDA ORO • SCHIOCCA = SCINTILLE • CUORE = ROSA</div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const effectStatus = document.getElementById('effect-status');
        const instruction = document.getElementById('instruction');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let handStates = {};
        let lastClapTime = 0;
        let lastSnapTime = {};

        class Particle {
            constructor(x, y, type = 'firework') {
                this.x = x;
                this.y = y;
                this.type = type;

                if (type === 'heart') {
                    const t = Math.random() * Math.PI * 2;
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    const sf = Math.random() * 0.6 + 0.4;
                    this.vx = hx * sf * 0.4;
                    this.vy = hy * sf * 0.4;
                    this.color = ['#ff1493', '#ff69b4', '#ffb6c1', '#ffffff', '#ff66cc'][Math.floor(Math.random() * 5)];
                    this.size = Math.random() * 5 + 3;
                    this.decay = Math.random() * 0.015 + 0.01;
                } else if (type === 'shockwave') {
                    // Onda d'urto dorata circolare
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 16 + 8;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.color = ['#ffaa00', '#ffd700', '#ff8c00', '#ffffff'][Math.floor(Math.random() * 4)];
                    this.size = Math.random() * 6 + 3;
                    this.decay = Math.random() * 0.025 + 0.015;
                } else if (type === 'snap') {
                    // Scintille elettriche blu/viola per lo schiocco
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 18 + 6;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.color = ['#00ffff', '#9933ff', '#ffffff', '#0080ff'][Math.floor(Math.random() * 4)];
                    this.size = Math.random() * 4 + 2;
                    this.decay = Math.random() * 0.03 + 0.02;
                } else {
                    // Fuoco d'artificio standard
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 14 + 5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.color = ['#00ffcc', '#ff3399', '#ffcc00', '#ffffff', '#3333ff'][Math.floor(Math.random() * 5)];
                    this.size = Math.random() * 4 + 2;
                    this.decay = Math.random() * 0.02 + 0.012;
                }
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.type === 'heart') {
                    this.vx *= 0.96;
                    this.vy *= 0.96;
                } else if (this.type === 'shockwave' || this.type === 'snap') {
                    this.vx *= 0.92;
                    this.vy *= 0.92;
                } else {
                    this.vy += 0.15; // gravità
                }
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = (this.type === 'heart' || this.type === 'shockwave') ? 18 : 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function getHandSpread(landmarks) {
            const wrist = landmarks[0];
            let totalDist = 0;
            const tips = [8, 12, 16, 20];
            tips.forEach(tipIdx => {
                const dx = landmarks[tipIdx].x - wrist.x;
                const dy = landmarks[tipIdx].y - wrist.y;
                totalDist += Math.hypot(dx, dy);
            });
            return totalDist / 4;
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const handsCount = results.multiHandLandmarks.length;
                effectStatus.innerText = `MANI RILEVATE: ${handsCount} (LUNGA DISTANZA ATTIVA)`;
                effectStatus.style.color = "#00ffcc";

                // 1. GESTO BATTI LE MANI (CLAP / HIGH FIVE)
                if (handsCount >= 2) {
                    const h1 = results.multiHandLandmarks[0];
                    const h2 = results.multiHandLandmarks[1];
                    
                    // Distanza tra i polsi o centri palmo
                    const palmDist = Math.hypot(h1[0].x - h2[0].x, h1[0].y - h2[0].y);
                    const now = Date.now();

                    if (palmDist < 0.18 && (now - lastClapTime > 1500)) {
                        lastClapTime = now;
                        const midX = (1 - (h1[0].x + h2[0].x) / 2) * window.innerWidth;
                        const midY = ((h1[0].y + h2[0].y) / 2) * window.innerHeight;

                        effectStatus.innerText = "⚡ BATTI IL CINQUE / CLAP! ONDA ORO! ⚡";
                        effectStatus.style.color = "#ffaa00";
                        instruction.innerText = "🌟 ESPLOSIONE ENERGETICA DOPPIA! 🌟";

                        for (let i = 0; i < 70; i++) {
                            particles.push(new Particle(midX, midY, 'shockwave'));
                        }
                    }

                    // 2. GESTO CUORE A DUE MANI
                    const thumbDist = Math.hypot(h1[4].x - h2[4].x, h1[4].y - h2[4].y);
                    const indexDist = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);

                    if (thumbDist < 0.15 && indexDist < 0.15) {
                        const centerX = (1 - (h1[8].x + h2[8].x) / 2) * window.innerWidth;
                        const centerY = ((h1[8].y + h2[8].y) / 2) * window.innerHeight;

                        effectStatus.innerText = "❤️ CUORE MAGICO ATTIVATO! ❤️";
                        effectStatus.style.color = "#ff1493";
                        instruction.innerText = "✨ SPETTACOLO ROMANTICO IN CORSO! ✨";

                        for (let i = 0; i < 4; i++) {
                            particles.push(new Particle(centerX, centerY, 'heart'));
                        }
                    }
                }

                // 3. ANALISI SINGOLA MANO (FUOCHI E SCHIOCCO DITA)
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.4)', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#00ffcc', lineWidth: 1, radius: 2});

                    const spread = getHandSpread(landmarks);
                    const palmX = (1 - landmarks[9].x) * window.innerWidth;
                    const palmY = landmarks[9].y * window.innerHeight;

                    // Rilevamento Schiocco di Dita (Distanza stretta tra pollice 4 e medio 12)
                    const snapDist = Math.hypot(landmarks[4].x - landmarks[12].x, landmarks[4].y - landmarks[12].y);
                    const now = Date.now();
                    if (!lastSnapTime[index]) lastSnapTime[index] = 0;

                    if (snapDist < 0.05 && (now - lastSnapTime[index] > 1000)) {
                        lastSnapTime[index] = now;
                        effectStatus.innerText = "✨ SCHIOCCO DI DITA! SCINTILLE ELETTRICHE! ✨";
                        effectStatus.style.color = "#00ffff";
                        instruction.innerText = "⚡ PIOGGIA DI SCINTILLE AL NEON! ⚡";

                        for (let i = 0; i < 50; i++) {
                            particles.push(new Particle(palmX, palmY, 'snap'));
                        }
                    }

                    // Fuoco d'artificio classico (Pugno -> Apertura)
                    const isClosed = spread < 0.25;
                    const isOpen = spread > 0.35;

                    if (!handStates[index]) {
                        handStates[index] = { wasClosed: false };
                    }

                    if (isClosed) {
                        handStates[index].wasClosed = true;
                    }

                    if (handStates[index].wasClosed && isOpen) {
                        instruction.innerText = "🎆 FUOCO D'ARTIFICIO ESPLOSIVO! 🎆";
                        for (let i = 0; i < 50; i++) {
                            particles.push(new Particle(palmX, palmY, 'firework'));
                        }
                        handStates[index].wasClosed = false;
                    }
                });

            } else {
                effectStatus.innerText = "IN ATTESA DI MANI (FUNZIONA ANCHE DA LONTANO)...";
                effectStatus.style.color = "#888888";
                instruction.innerText = "PUGNO = FUOCO • BATTI MANI = ONDA ORO • SCHIOCCA = SCINTILLE • CUORE = ROSA";
            }

            // Aggiorna e disegna particelle
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(canvasCtx);
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5, // Abbassato leggermente per rilevare benissimo anche da lontano
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>
