<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Fireworks / Sparkles Effect</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ffaa00;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .hud-panel {
            position: absolute;
            border: 1px solid rgba(255, 170, 0, 0.4);
            background: rgba(10, 5, 0, 0.85);
            padding: 10px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
        }

        #top-left { top: 20px; left: 20px; }
        
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.2;
            z-index: 1;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
        }

        #instruction {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            letter-spacing: 2px;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff6600;
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="top-left" class="hud-panel">
        EFFETTO: <span id="effect-status" style="color: #ffaa00;">ATTESA PUGNO...</span>
    </div>

    <div id="instruction">CHIUDI LA MANO E APRI DI SCATTO PER I FUOCHI D'ARTIFICIO!</div>

    <video class="input_video" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const effectStatus = document.getElementById('effect-status');
        const instruction = document.getElementById('instruction');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Sistema di particelle per i fuochi d'artificio
        let particles = [];
        let wasClosed = false; // Tiene traccia se prima la mano era chiusa

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Velocità casuale in tutte le direzioni per l'esplosione
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015; // Velocità di sbiadimento
                this.color = ['#ff3300', '#ffcc00', '#ffffff', '#ff00aa', '#00ffff'][Math.floor(Math.random() * 5)];
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // Piccolo effetto gravità verso il basso
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Calcola la distanza media delle dita dal polso (punto 0) per capire se la mano è aperta o chiusa
        function getHandSpread(landmarks) {
            const wrist = landmarks[0];
            let totalDist = 0;
            // Punte delle dita: indice(8), medio(12), anulare(16), mignolo(20)
            const tips = [8, 12, 16, 20];
            tips.forEach(tipIdx => {
                const dx = landmarks[tipIdx].x - wrist.x;
                const dy = landmarks[tipIdx].y - wrist.y;
                totalDist += Math.hypot(dx, dy);
            });
            return totalDist / 4;
        }

        function onResults(results) {
            canvasCtx.save();
            // Pulisce lo schermo mantenendo una scia leggermente fluida
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Disegno della mano stilizzato oro/arancio
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255, 170, 0, 0.4)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#ffaa00', lineWidth: 1, radius: 2});

                // Misuriamo l'apertura della mano
                const spread = getHandSpread(landmarks);
                
                // Centro del palmo (approssimativo usando la media tra polso 0 e nocche centrali)
                const palmX = (1 - landmarks[9].x) * window.innerWidth;
                const palmY = landmarks[9].y * window.innerHeight;

                // Soglie per determinare se è pugno o aperta
                // (I valori possono variare leggermente in base alla distanza dalla webcam)
                const isClosed = spread < 0.28; 
                const isOpen = spread > 0.38;

                if (isClosed) {
                    wasClosed = true;
                    effectStatus.innerText = "PUGN0 CHIUSO - CARICAMENTO...";
                    effectStatus.style.color = "#ff3300";
                }

                // Se prima era chiusa e ora si apre di scatto -> BOOM! Fuochi d'artificio
                if (wasClosed && isOpen) {
                    effectStatus.innerText = "BOOM! FUOCHI ATTIVATI!";
                    effectStatus.style.color = "#00ffcc";
                    instruction.innerText = "✨ SPETTACOLO ESPLOSIVO! ✨";

                    // Genera tantissime particelle al centro del palmo
                    for (let i = 0; i < 70; i++) {
                        particles.push(new Particle(palmX, palmY));
                    }

                    wasClosed = false; // Reset dello stato finché non chiudi di nuovo
                } else if (!isClosed && !wasClosed) {
                    effectStatus.innerText = "MANA STABILE";
                    effectStatus.style.color = "#ffaa00";
                    instruction.innerText = "CHIUDI LA MANO E APRI DI SCATTO";
                }

            } else {
                effectStatus.innerText = "IN ATTESA DI MANO...";
                effectStatus.style.color = "#888888";
                instruction.innerText = "MOSTRA LA MANO ALLA WEBCAM";
            }

            // Aggiorna e Disegna tutte le particelle attive
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(canvasCtx);
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });
        camera.start();
    </script>
</body>
</html>
